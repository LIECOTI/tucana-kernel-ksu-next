name: Build KernelSU Next for Tucana

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    env:
      DEFCONFIG: vendor/sm6150-perf_defconfig

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Download Proton Clang (Toolchain)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone LineageOS Kernel Source
        run: |
          git clone --depth=1 -b lineage-23.1 https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git kernel-source

      - name: Setup KernelSU Next (Legacy mode for 4.14)
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Patch Defconfig with KPROBES and CPU Fix
        run: |
          cd kernel-source
          CONFIG_FILE="arch/arm64/configs/$DEFCONFIG"
          
          echo "Patching $CONFIG_FILE..."
          echo "" >> $CONFIG_FILE
          
          # Фикс ошибки NR_CPUS
          echo "# CPU Fix" >> $CONFIG_FILE
          echo "CONFIG_NR_CPUS=8" >> $CONFIG_FILE
          
          # Оставляем только базовые параметры KPROBES в конфиге
          echo "CONFIG_KPROBES=y" >> $CONFIG_FILE
          echo "CONFIG_HAVE_KPROBES=y" >> $CONFIG_FILE
          echo "CONFIG_KPROBE_EVENTS=y" >> $CONFIG_FILE
          echo "CONFIG_OVERLAY_FS=y" >> $CONFIG_FILE

      - name: Build the Kernel
        run: |
          cd kernel-source
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CC=clang
          
          MAKE_ARGS="O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf- AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          
          # Насильно передаем флаги KernelSU прямо в компилятор
          KSU_FLAGS="CONFIG_KSU=y CONFIG_KSU_KPROBE_HOOKS=y"
          
          # Генерация .config
          make $MAKE_ARGS $DEFCONFIG
          
          # Сама сборка (Image.gz-dtb) с принудительными флагами KSU
          make -j$(nproc --all) $MAKE_ARGS $KSU_FLAGS
          
      - name: Prepare AnyKernel3 (Flashable ZIP)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          
          # Копируем готовое ядро в AK3
          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          
          # Настраиваем anykernel.sh под tucana
          sed -i 's/device.name1=maguro/device.name1=tucana/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toro/device.name2=MiNote10/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot/block=auto/g' AnyKernel3/anykernel.sh
          
          # Упаковываем
          cd AnyKernel3
          zip -r9 ../Tucana-KSU-Next-Kernel.zip *

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Tucana-KernelSU-Next
          path: Tucana-KSU-Next-Kernel.zip
