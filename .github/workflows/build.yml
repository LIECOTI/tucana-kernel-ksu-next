name: Find Defconfig

on:
  workflow_dispatch:

jobs:
  find-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b lineage-23.1 https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git kernel-source
          cd kernel-source
          echo " "
          echo "🚨 ВОТ СПИСОК ВСЕХ БАЗОВЫХ КОНФИГОВ 🚨"
          find arch/arm64/configs -type f -name "*defconfig"
          echo "======================================="
