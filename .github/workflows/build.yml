name: Build KernelSU Next for Tucana

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Download Proton Clang (Toolchain)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone LineageOS Kernel Source
        run: |
          git clone --depth=1 -b lineage-23.1 https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git kernel-source

      - name: Setup KernelSU Next (Legacy mode for 4.14)
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Apply Source Patches
        run: |
          cd kernel-source
          echo "Patching tracepoint limitation..."
          sed -i 's/#if NR_CPUS > 32/#if NR_CPUS > 128/g' include/trace/events/sched.h
          sed -i 's/"Unsupported NR_CPUS for lb tracepoint."/"Bypassed"/g' include/trace/events/sched.h

      - name: Assemble Custom Defconfig (The Safe Way)
        run: |
          cd kernel-source
          
          # 1. Находим базовый конфиг процессора
          BASE_CONFIG=$(find arch/arm64/configs -type f \( -name "*sm6150*perf*defconfig" -o -name "*sm6150*defconfig" \) | head -n 1)
          echo "Базовый конфиг: $BASE_CONFIG"
          
          # 2. Создаем свой собственный монолитный дефконфиг прямо в исходниках
          cp $BASE_CONFIG arch/arm64/configs/tucana_ksu_defconfig
          
          # 3. Добавляем фрагмент tucana.config
          if [ -f "arch/arm64/configs/vendor/tucana.config" ]; then
            cat arch/arm64/configs/vendor/tucana.config >> arch/arm64/configs/tucana_ksu_defconfig
            echo "Фрагмент tucana.config добавлен."
          fi
          
          # 4. Добавляем только KPROBES (KSU передадим позже, чтобы не срезало)
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/tucana_ksu_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/tucana_ksu_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/tucana_ksu_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/tucana_ksu_defconfig
          
          # 5. Принудительно защищаем NO_HZ (чтобы баг точно не повторился)
          echo "CONFIG_NO_HZ=y" >> arch/arm64/configs/tucana_ksu_defconfig
          echo "CONFIG_NO_HZ_COMMON=y" >> arch/arm64/configs/tucana_ksu_defconfig

      - name: Build the Kernel
        run: |
          cd kernel-source
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CC=clang
          
          MAKE_ARGS="O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf- AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          
          # Передаем флаги KSU прямо в компилятор!
          KSU_FLAGS="CONFIG_KSU=y CONFIG_KSU_KPROBE_HOOKS=y"
          
          # Генерируем конфиг
          make $MAKE_ARGS tucana_ksu_defconfig
          
          # Собираем
          set +e
          make -j$(nproc --all) $MAKE_ARGS $KSU_FLAGS 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo ""
            echo "========================================================"
            echo "🚨 НАСТОЯЩАЯ ОШИБКА СБОРКИ (СКОПИРУЙ МНЕ ЭТОТ ТЕКСТ) 🚨"
            echo "========================================================"
            grep -iE "error:|undefined reference|no such file" -B 2 -A 5 build.log
            echo "========================================================"
            exit 1
          fi

      - name: Prepare AnyKernel3 (Flashable ZIP)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          sed -i 's/device.name1=maguro/device.name1=tucana/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toro/device.name2=MiNote10/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot/block=auto/g' AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 ../Tucana-KSU-Next-Kernel.zip *

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Tucana-KernelSU-Next
          path: Tucana-KSU-Next-Kernel.zip
