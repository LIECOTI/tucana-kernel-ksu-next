name: Build KernelSU Next for Tucana

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: 3. Download Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 4. Download Kernel Source
        run: |
          git clone --depth=1 -b lineage-23.1 https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git kernel-source

      - name: 5. Setup KernelSU Next
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: 6. Bruteforce Kconfig & Kbuild
        run: |
          cd kernel-source
          
          # 1. Фикс бага планировщика (NR_CPUS)
          sed -i 's/#if NR_CPUS > 32/#if NR_CPUS > 128/g' include/trace/events/sched.h
          sed -i 's/"Unsupported NR_CPUS for lb tracepoint."/"Bypassed"/g' include/trace/events/sched.h
          
          # 2. Вырезаем LTO (главный враг KPROBES) из базового конфига
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          
          # 3. Жестко прописываем KPROBES и KSU прямо в конфиг телефона
          cat <<EOF >> arch/arm64/configs/vendor/tucana.config
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          CONFIG_KSU_KPROBE_HOOKS=y
          EOF
          
          # 4. Превращаем фатальную ошибку KernelSU в обычный текст
          sed -i 's/$(error.*No hooks were defined.*)/$(info Bypassed KSU hook check)/g' drivers/kernelsu/Kbuild
          
          # 5. ФИКС ОШИБКИ ДРАЙВЕРА КАМЕРЫ (cam_trace.h file not found)
          sed -i 's|#define TRACE_INCLUDE_PATH \.|#define TRACE_INCLUDE_PATH ../../drivers/media/platform/msm/camera/cam_utils|g' drivers/media/platform/msm/camera/cam_utils/cam_trace.h

      - name: 7. Build the Kernel
        run: |
          cd kernel-source
          
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CC=clang
          
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"
          
          # Генерируем конфиги
          make vendor/sdmsteppe-perf_defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/tucana.config
          make olddefconfig
          
          # Компиляция
          echo "Начинаю компиляцию..."
          set +e
          make -j$(nproc --all) \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error" \
            CONFIG_KSU=y \
            CONFIG_KSU_KPROBE_HOOKS=y 2>&1 | tee build.log
            
          BUILD_STATUS=${PIPESTATUS[0]}
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo ""
            echo "========================================================"
            echo "🚨 НАСТОЯЩАЯ ОШИБКА СБОРКИ: 🚨"
            echo "========================================================"
            # Теперь ищем только фатальные ошибки исходников!
            grep -iE "fatal error:|error:" build.log -B 2 -A 5 | head -n 30
            echo "========================================================"
            exit 1
          fi

      - name: 8. Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          
          cp kernel-source/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || \
          cp kernel-source/arch/arm64/boot/Image.gz AnyKernel3/ || \
          cp kernel-source/arch/arm64/boot/Image AnyKernel3/
          
          sed -i 's/device.name1=maguro/device.name1=tucana/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toro/device.name2=MiNote10/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot/block=auto/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../Tucana-KernelSU-Next.zip *

      - name: 9. Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Tucana-KernelSU-Next-Flashable
          path: Tucana-KernelSU-Next.zip
