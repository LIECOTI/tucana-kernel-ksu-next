name: Build KernelSU Next for Tucana (Manual Hooks)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: 3. Download Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 4. Download Kernel Source
        run: |
          git clone --depth=1 -b lineage-23.1 https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git kernel-source

      - name: 5. Setup KernelSU Next
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: 6. Inject Manual Hooks (Surgically Precise)
        run: |
          cd kernel-source
          
          # 1. Фикс бага планировщика (NR_CPUS)
          sed -i 's/#if NR_CPUS > 32/#if NR_CPUS > 128/g' include/trace/events/sched.h
          sed -i 's/"Unsupported NR_CPUS for lb tracepoint."/"Bypassed"/g' include/trace/events/sched.h
          
          # 2. ФИКС ОШИБКИ КАМЕРЫ
          mkdir -p include/trace/events
          cp drivers/media/platform/msm/camera/cam_utils/cam_trace.h include/trace/events/cam_trace.h
          
          echo "Внедряю Manual Hooks напрямую в C-код ядра..."
          
          # --- ПАТЧ fs/exec.c ---
          sed -i '/int do_execve(struct filename \*filename,/i #ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif' fs/exec.c
          sed -i '/return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);/i \t#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, \&filename, \&argv, \&envp, 0);\n\t#endif' fs/exec.c
          
          # --- ПАТЧ fs/open.c ---
          sed -i '/SYSCALL_DEFINE3(faccessat, /i #ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif' fs/open.c
          sed -i '/if (mode & ~S_IRWXO)/i \t#ifdef CONFIG_KSU\n\tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n\t#endif' fs/open.c
          
          # --- ПАТЧ fs/read_write.c ---
          sed -i '/SYSCALL_DEFINE3(read, /i #ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif' fs/read_write.c
          sed -i '/if (f.file) {/i \t#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_sys_read(fd, \&buf, \&count);\n\t#endif' fs/read_write.c
          
          # --- ПАТЧ fs/stat.c ---
          sed -i '/SYSCALL_DEFINE4(newfstatat, /i #ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif' fs/stat.c
          sed -i '/error = vfs_fstatat(dfd, filename, \&stat, flag);/i \t#ifdef CONFIG_KSU\n\tksu_handle_stat(\&dfd, \&filename, \&flag);\n\t#endif' fs/stat.c
          
          # --- ПАТЧ kernel/reboot.c ---
          sed -i '/SYSCALL_DEFINE4(reboot, /i #ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif' kernel/reboot.c
          sed -i '/if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))/i \t#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, \&arg);\n\t#endif' kernel/reboot.c
          
          # Очищаем Makefile KSU от ошибки и принудительно собираем его
          sed -i 's/obj-$(CONFIG_KSU) += kernelsu\//obj-y += kernelsu\//g' drivers/Makefile
          sed -i 's/$(error.*No hooks were defined.*)/$(info Bypassed KSU hook check)/g' drivers/kernelsu/Kbuild

      - name: 7. Configure and Build Kernel
        run: |
          cd kernel-source
          
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CC=clang
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"
          
          # Генерируем конфиги
          make vendor/sdmsteppe-perf_defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/tucana.config
          
          # Включаем только KSU (KPROBES нам больше вообще не нужен)
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_OVERLAY_FS=y" >> .config
          
          make olddefconfig
          
          # Компиляция
          echo "Начинаю компиляцию ядра..."
          set +e
          make -j$(nproc --all) \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error" \
            CONFIG_KSU=y 2>&1 | tee build.log
            
          BUILD_STATUS=${PIPESTATUS[0]}
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo ""
            echo "========================================================"
            echo "🚨 ОШИБКА СБОРКИ: 🚨"
            echo "========================================================"
            grep -iE "fatal error:|error:" build.log -B 2 -A 5 | tail -n 30
            exit 1
          fi

      - name: 8. Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          
          cp kernel-source/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || \
          cp kernel-source/arch/arm64/boot/Image.gz AnyKernel3/ || \
          cp kernel-source/arch/arm64/boot/Image AnyKernel3/
          
          cat <<EOF > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=Tucana KernelSU Next (Manual)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=tucana
          device.name2=
          supported.versions=
          supported.patchlevels=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          no_block_display=true;
          . tools/ak3-core.sh;
          rm -rf \$ramdisk/overlay;
          rm -rf \$ramdisk/overlay.d;
          dump_boot;
          write_boot;
          EOF
          
          cd AnyKernel3
          zip -r9 ../Tucana-KernelSU-Next.zip *

      - name: 9. Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Tucana-KernelSU-Next-Flashable
          path: Tucana-KernelSU-Next.zip
